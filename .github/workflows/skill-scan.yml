name: Skill security scan

on:
  pull_request:
    paths:
      - "skills/**"
      - "scripts/scan_skills.sh"
      - "scripts/skill-scanner-policy.yaml"
      - ".github/workflows/skill-scan.yml"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      # Only skills the PR adds or modifies; with none (script/workflow-only changes, deletions) every skill is scanned
      - name: Scan changed skills
        id: scan
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mapfile -t skills < <(git diff --name-only --diff-filter=d "$BASE_SHA...$HEAD_SHA" -- skills/ | cut -d/ -f2 | sort -u)
          bash scripts/scan_skills.sh --report "$RUNNER_TEMP/report.md" -- "${skills[@]}"

      - name: Publish job summary
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -f "$RUNNER_TEMP/report.md" ] ||
            echo "⚠️ The scan did not complete; see the [workflow run]($RUN_URL)." >"$RUNNER_TEMP/report.md"
          {
            echo "## Skill security scan"
            echo
            cat "$RUNNER_TEMP/report.md"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upsert pull request comment
        if: "!github.event.pull_request.head.repo.fork"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          marker='<!-- skill-security-scan -->'
          body="$RUNNER_TEMP/comment.md"
          {
            echo "$marker"
            echo "## Skill security scan"
            echo
            cat "$RUNNER_TEMP/report.md"
          } >"$body"
          # GitHub rejects comment bodies over 65536 characters
          if [ "$(wc -c <"$body")" -gt 60000 ]; then
            head -c 60000 "$body" >"$body.tmp"
            printf '\n\n_Truncated. The full report is in the [job summary](%s)._\n' "$RUN_URL" >>"$body.tmp"
            mv "$body.tmp" "$body"
          fi
          existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq "first(.[] | select(.body | startswith(\"$marker\")) | .id)")
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F body=@"$body" >/dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@"$body" >/dev/null
          fi

      - name: Fail on HIGH/CRITICAL findings
        if: steps.scan.outcome != 'success'
        run: |
          echo "::error::Skill security scan found HIGH/CRITICAL issues or failed to run (see job summary)"
          exit 1
