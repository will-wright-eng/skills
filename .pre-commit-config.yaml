# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-merge-conflict
      - id: check-yaml
      # Replicated skills are byte-for-byte upstream copies; keep every fixer off them.
      # Mirror of scripts/replicated-skills.json — add new replicated skills to both.
      - id: end-of-file-fixer
        exclude: &replicated_skills ^skills/(caveman|grill-me|grill-with-docs|improve-codebase-architecture|karpathy-guidelines|ponytail|worktrunk)/
      - id: pretty-format-json
        args: [--autofix, --no-ensure-ascii, --no-sort-keys]
      - id: trailing-whitespace
        exclude: *replicated_skills
      - id: check-added-large-files
      - id: fix-byte-order-marker
        exclude: *replicated_skills
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: *replicated_skills

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.48.0
    hooks:
      - id: markdownlint
        exclude: *replicated_skills
        args:
          - --fix
        verbose: true
        entry: bash -c 'markdownlint "$@" || true' --

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
      - id: codespell
        args: ["--ignore-words=.codespell-ignore"]
        exclude: '\.git\/.*'

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck

  - repo: https://github.com/maxwinterstein/shfmt-py
    rev: v4.1.0
    hooks:
      - id: shfmt
        args: [-w, -i, "2", -ci]

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.28.0
    hooks:
      - id: zizmor

  - repo: local
    hooks:
      - id: agentskills-validate
        name: agentskills validate
        description: Validate skill directories against the agentskills.io spec (Claude Code frontmatter extensions stripped first)
        language: system
        files: ^skills/[^/]+/
        entry: bash scripts/validate_skill.sh
